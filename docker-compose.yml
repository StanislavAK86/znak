services:
  frontend:
    build:
      context: ./frontend
      args:
        - VUE_APP_API_URL=/api/
    container_name: znak_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./beckend      # ← проверьте, где Dockerfile
      dockerfile: Dockerfile
    container_name: znak_backend
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/db.sqlite3
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - DOCKER_ENV=True
      - PRODUCTION=True
      - ALLOWED_HOSTS=znak.it-atp.ru,stanislavak86-znak-5aac.twc1.net,.twc1.net,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://znak.it-atp.ru,https://stanislavak86-znak-5aac.twc1.net,https://*.twc1.net
      - USE_X_FORWARDED_HOST=True
      - DATA_UPLOAD_MAX_SIZE=52428800
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
  media_volume:
  sqlite_data: