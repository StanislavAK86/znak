services:
  backend:
    build:
      context: .
      dockerfile: beckend/Dockerfile
    container_name: znak_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - DOCKER_ENV=True
      - PRODUCTION=True
      - ALLOWED_HOSTS=znak.it-apt.ru,localhost,127.0.0.1
      - DATA_UPLOAD_MAX_SIZE=52428800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VUE_APP_API_URL=https://znak.it-apt.ru/api/
    container_name: znak_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend