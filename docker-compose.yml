services:
  frontend:
    build:
      context: ./frontend
      args:
        - VUE_APP_API_URL=/api/
    restart: unless-stopped
    ports:
      - "8080:80"      # первый сервис — на него идёт проксирование домена
    depends_on:
      - backend

  backend:
    build:
      context: ./backend          # проверьте реальное имя папки!
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - DOCKER_ENV=True
      - PRODUCTION=True
      - ALLOWED_HOSTS=znak.it-atp.ru,stanislavak86-znak-5aac.twc1.net,.twc1.net,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://znak.it-atp.ru,https://stanislavak86-znak-5aac.twc1.net,https://*.twc1.net
      - USE_X_FORWARDED_HOST=True
      - DATA_UPLOAD_MAX_SIZE=52428800
